plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.liu.weixinfragment'
    compileSdk 34

    defaultConfig {
        applicationId "com.liu.weixinfragment"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1' // 请确认你项目中使用的版本
    implementation 'com.google.android.material:material:1.10.0' // 添加这行，建议使用最新稳定版
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4' // 请确认你项目中使用的版本
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}